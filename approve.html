<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PMS Approval</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f5f7fb; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 560px); padding: 40px; border: 1px solid #e2e7f0; border-radius: 16px; background: white; box-shadow: 0 8px 30px rgba(23,32,51,.06); }
      .eyebrow { margin: 0 0 8px; color: #356bd4; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
      h1 { margin: 0; font-size: 32px; letter-spacing: -.04em; } p { color: #687792; line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
      a { display: inline-block; padding: 11px 16px; border-radius: 9px; color: white; background: #356bd4; font-size: 14px; font-weight: 700; text-decoration: none; }
      a.secondary { color: #356bd4; background: #edf3ff; }
    </style>
  </head>
  <body><main><p class="eyebrow">PMS Console</p><h1>Approval center</h1><p>The approval page is available. Review your portfolio status, then return to the live console to continue managing properties and resident operations.</p><div class="actions"><a href="/">Back to PMS Console</a><a class="secondary" href="/#approvals">View approval progress</a></div></main></body>
</html>
